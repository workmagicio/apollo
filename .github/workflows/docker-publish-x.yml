name: Publish Docker Image X

# Builds and pushes only apollo-portal: config / admin service run the upstream apolloconfig images.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: 'registry'
        required: true
        default: 'docker.io'
      organize:
        description: 'organize'
        required: true
        default: 'workmagic'
      version:
        description: 'version, must equal <revision> in pom.xml'
        required: true
        default: '2.3.3-SNAPSHOT'
      tag:
        description: 'image tag, use a new one for every release (e.g. 2.3.3-wm.1)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Build package
        run: ./scripts/build.sh
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push apollo-portal
        uses: docker/build-push-action@v6
        with:
          context: ./apollo-portal/target
          platforms: linux/amd64
          file: ./apollo-portal/src/main/docker/Dockerfile
          push: true
          build-args: VERSION=${{ github.event.inputs.version }}
          tags: ${{ github.event.inputs.registry }}/${{ github.event.inputs.organize }}/apollo-portal:${{ github.event.inputs.tag }}
